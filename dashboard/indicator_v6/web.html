<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delta1 · 指标研究</title>
<style>
:root{color-scheme:light;--bg:#f4f7fa;--ink:#17334f;--muted:#526779;--line:#ccd9e4;--blue:#08457e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 "Microsoft YaHei UI","Microsoft YaHei",sans-serif}header{padding:22px 5vw 16px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}h1{font-size:23px;margin:0;letter-spacing:1px}header span,.muted{color:var(--muted)}main{max-width:1440px;margin:24px auto;padding:0 32px}nav{display:flex;gap:8px;margin-bottom:20px}button,select{font:inherit;color:inherit;border:1px solid var(--line);background:white;border-radius:6px;padding:8px 12px;min-width:0}button{cursor:pointer}nav button[aria-selected=true]{background:var(--blue);color:white}label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}.controls{display:grid;grid-template-columns:2fr 1fr 1.5fr;gap:14px;margin-bottom:16px}.controls select{width:100%;font-size:14px}h2{font-size:25px;margin:12px 0 8px}h3{font-size:17px;margin:24px 0 8px}.purpose{font-size:15px;margin:0;max-width:950px}.source{font-size:12px;margin:12px 0}.status{color:#08745b;font-weight:600;margin:14px 0}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.metric{padding:18px 20px;background:white;border:1px solid var(--line);border-radius:10px}.metric b{display:block;font:600 31px/1.3 "Segoe UI",sans-serif;margin:10px 0;color:var(--blue)}.metric b small{font:13px "Microsoft YaHei UI",sans-serif;margin-left:8px}.metric p{font-size:12px;color:var(--muted);margin:0;overflow-wrap:anywhere}.reason{color:#9a5b12!important}details{border:1px solid var(--line);border-radius:7px;background:white;margin:14px 0}summary{cursor:pointer;padding:12px 16px;font-weight:600}.detail{padding:0 24px 24px;overflow:auto}.detail table{width:100%;text-align:left;border-collapse:collapse}.detail td,.detail th{padding:8px;border-bottom:1px solid #eaf1f7;vertical-align:top}.detail pre{overflow-wrap:anywhere;font-size:12px}.chart{position:relative;background:white;border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:16px 0}.chart h3{margin:0}.legend{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0;color:var(--muted);font-size:12px}.legend i{width:16px;height:3px;display:inline-block;vertical-align:middle;margin-right:6px}.chart svg{width:100%;height:255px;display:block;touch-action:pan-y}.chart text{font-family:"Microsoft YaHei UI",sans-serif;font-size:11px;fill:var(--muted)}.tooltip{min-height:55px;padding-top:10px;font-size:12px;color:var(--muted);white-space:pre-line}.loading{padding:70px;text-align:center;color:var(--muted)}.error{color:#9a5b12}footer{margin:25px 0;color:var(--muted);font-size:12px}math{font-size:24px;margin:18px 0;display:block}#error{white-space:pre-wrap}
@media(max-width:850px){main{padding:0 16px;margin:16px auto}.controls{grid-template-columns:1fr 1fr}.controls label:first-child{grid-column:1/-1}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:16px}header span{display:none}h2{font-size:21px}}
@media(max-width:520px){.controls,.metrics{grid-template-columns:1fr}nav button{padding:7px 8px;font-size:12px}main{padding:0 12px}.metric{padding:14px}.chart{padding:12px}.detail{padding:0 12px 16px}}
.detail img{max-width:100%;height:auto}
</style>
<header><h1>Δ DELTA1 <small>· 指标研究</small></h1><span>第六版 · 2026.10.23</span></header><main>
<nav><button data-group="A" aria-selected="true">A 期指 · 12</button><button data-group="B">B 跨期 · 10</button><button data-group="C">C 跨指数期货 · 10</button></nav>
<div class="controls"><label>研究指标<select id="indicator"></select></label><label>输入 X<select id="variant"></select></label><label>数据来源<select id="source"><option value="replay">研究回放 · 第六版真实归档</option><option value="published">现有数据服务 · 已发布历史</option></select></label><label>合约 / 固定合约对<select id="identity"><option value="">按资料规则逐日选择合约</option></select></label><label>截止日期<select id="day"><option value="">最新可用观测</option></select></label></div>
<div id="error" class="error" role="alert"></div><div id="content"></div><footer>数据与计算由现有 App 的统一指标服务提供。研究回放用于核对，观测时间以各输出为准。</footer></main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let catalog=[],group='A',generation=0,controller=null,current=null;const colors=['#08457e','#b8703d','#568375','#815399'];
function option(value,label){return `<option value="${esc(value)}">${esc(label)}</option>`}
function populate(){ $('#indicator').innerHTML=catalog.filter(c=>c.group===group).map(c=>option(c.id,c.id+' '+c.title)).join('');populateX() }
function populateX(){const c=catalog.find(c=>c.id===$('#indicator').value),old=$('#variant').value;$('#variant').innerHTML=c.variants.map(v=>option(v.id,v.label)).join('');if(c.variants.some(v=>v.id===old))$('#variant').value=old;load()}
function fmt(p,r){if(p.value===null)return '—';const scale=p.field==='K'?100:1;return (p.value*scale).toLocaleString('zh-CN',{minimumFractionDigits:p.field==='K'?2:r.units[p.unit].display_decimals,maximumFractionDigits:p.field==='K'?2:r.units[p.unit].display_decimals})}
function unit(p,r){return p.field==='K'?'%':r.units[p.unit].label}function reasons(p,r){return p.reason_codes.map(k=>r.reason_labels[k]||k).join('；')}
function choiceUpdate(selector,items,label){const el=$(selector),old=el.value;el.innerHTML=option('',label)+items.map(x=>option(Array.isArray(x)?JSON.stringify(x):x,Array.isArray(x)?x.join(' / '):x)).join('');if([...el.options].some(o=>o.value===old))el.value=old}
async function load(){const token=++generation;if(controller)controller.abort();controller=new AbortController();window.lastResult=null;document.body.dataset.ready='';$('#content').innerHTML='<div class="loading">正在读取完整历史并重算所选口径…</div>';$('#error').textContent='';current=null;const p=new URLSearchParams({id:$('#indicator').value,x:$('#variant').value,source:$('#source').value});for(const k of ['identity','day'])if($('#'+k).value)p.set(k,$('#'+k).value);
try{const response=await fetch('/api/indicator?'+p,{signal:controller.signal}),r=await response.json();if(token!==generation)return;if(!response.ok)throw Error(r.error);current=r;window.lastResult=r;render(r)}catch(e){if(e.name!=='AbortError'&&token===generation){$('#content').innerHTML='';$('#error').textContent='读取未完成：'+e.message}}}
function render(r){choiceUpdate('#identity',r.choices.identities,'按资料规则逐日选择合约');choiceUpdate('#day',r.choices.days,'最新可用观测');for(const v of r.variants){const o=[...$('#variant').options].find(o=>o.value===v.id);o.disabled=!v.enabled;o.title=v.reason}
const metrics=r.fields.map(f=>{const p=r.series[f.key].at(-1);if(!p)return '';return `<article class="metric" data-field="${esc(f.key)}"><div>${esc(f.label)}</div><b>${fmt(p,r)}<small>${esc(unit(p,r))}</small></b><p>${p.frequency==='1m'?'分钟':'日频'} · ${esc(p.timestamp.replace('T',' '))}<br>${esc(p.contract_ids.join(' / '))}</p>${p.value===null?`<p class="reason">${esc(reasons(p,r))}</p>`:''}</article>`}).join('');
$('#content').innerHTML=`<h2>${esc(r.id+' '+r.title)}</h2><p class="purpose">${esc(r.purpose)}</p><p class="source muted">${esc(r.source+' · '+r.variant_label)} · 观测 ${esc(r.observed_at.replace('T',' '))}${r.volume_note?'<br>'+esc(r.volume_note):''}</p><div class="status">${{VALID:'全部输出有效',PARTIAL:'部分输出有效 · 独立有效值予以保留',INVALID:'当前输出无效 · 具体原因见各数值'}[r.status]}</div><div class="metrics">${metrics}</div><details id="details"><summary>经济含义、公式、符号与边界</summary><div class="detail">${r.detail_html}</div></details><div id="charts"></div><details><summary>高级详情：原始字段与原因代码</summary><div class="detail">${r.advanced_html}</div></details>${r.limitations.map(x=>'<p class="muted">'+esc(x)+'</p>').join('')}`;
const panels=new Map;for(const f of r.fields){const k=f.frequency+'|'+(f.key==='K'?'pct':f.unit);if(!panels.has(k))panels.set(k,[]);panels.get(k).push(f)}for(const fs of panels.values())chart(r,fs);
// Browser math uses native MathML; the desktop carries the same visible equation.
if(['A02','B02','C02'].includes(r.id))$('#details .detail').insertAdjacentHTML('afterbegin','<math xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mi>Z</mi><mo>=</mo><mfrac><mrow><msub><mi>X</mi><mi>t</mi></msub><mo>−</mo><msub><mi>μ</mi><mi>hist</mi></msub></mrow><msub><mi>s</mi><mi>hist</mi></msub></mfrac></mrow></math>');
document.body.dataset.ready=r.cache_key}
function chart(r,fs){const colors=r.chart_colors||['#244D69','#B8703D','#568375'];const points=r.series[fs[0].key];if(!points.length)return;const width=Math.max(320,$('#charts').clientWidth-40),height=255,left=55,right=35,top=20,bottom=32,n=points.length;const values=fs.flatMap(f=>r.series[f.key].filter(p=>p.value!==null).map(p=>p.value*(p.field==='K'?100:1)));let low=values.length?Math.min(...values):0,high=values.length?Math.max(...values):1;if(high===low){high+=1;low-=1}const pad=(high-low)*.12;high+=pad;low-=pad;if(fs.every(f=>f.key.endsWith('_pct'))){low=0;high=100}const xp=i=>left+i/Math.max(1,n-1)*(width-left-right),yp=y=>top+(high-y)/(high-low)*(height-top-bottom);let svg='';
for(let j=0;j<4;j++){const v=low+(high-low)*j/3,y=yp(v);svg+=`<line x1="${left}" x2="${width-right}" y1="${y}" y2="${y}" stroke="#eaf1f7"/><text x="${left-8}" y="${y+4}" text-anchor="end">${v.toFixed(2)}</text>`}
const ticks=width<600?3:6;for(let j=0;j<ticks;j++){const i=Math.round(j*(n-1)/(ticks-1)),p=points[i];svg+=`<text x="${xp(i)}" y="${height-5}" text-anchor="middle">${p.frequency==='1m'?p.timestamp.slice(11,16):p.timestamp.slice(2,10)}</text>`}
for(let i=1;i<n;i++)if(points[i].break_before||points[i].session_id!==points[i-1].session_id)svg+=`<line x1="${xp(i-.5)}" x2="${xp(i-.5)}" y1="${top}" y2="${height-bottom}" stroke="#ccd9e4" stroke-dasharray="3 4"/>`;
fs.forEach((f,j)=>{let d='',drawing=false;for(const [i,p]of r.series[f.key].entries()){if(p.value===null){drawing=false;continue}if(p.break_before)drawing=false;d+=(drawing?'L':'M')+xp(i).toFixed(3)+','+yp(p.value*(p.field==='K'?100:1)).toFixed(3)+' ';drawing=true}svg+=`<path data-field="${esc(f.key)}" d="${d}" fill="none" stroke="${colors[j%colors.length]}" stroke-width="1.7" vector-effect="non-scaling-stroke"/>`});
const el=document.createElement('section');el.className='chart';el.innerHTML=`<h3>${fs[0].frequency==='1m'?'分钟观测':'日频观测'} · ${esc(unit(points[0],r))}</h3><div class="legend">${fs.map((f,j)=>`<span><i style="background:${colors[j%colors.length]}"></i>${esc(f.label)}</span>`).join('')}</div><svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="${esc(fs.map(f=>f.label).join('、'))}">${svg}<line class="cursor" y1="${top}" y2="${height-bottom}" stroke="#526779" stroke-dasharray="2 3" visibility="hidden"/></svg><div class="tooltip">移动鼠标查看真实时刻、合约、口径、数值和状态；缺失点保留位置。</div>`;$('#charts').append(el);
el.querySelector('svg').addEventListener('pointermove',e=>{const box=e.currentTarget.getBoundingClientRect(),x=(e.clientX-box.left)/box.width*width,i=Math.max(0,Math.min(n-1,Math.round((x-left)/(width-left-right)*(n-1)))),p=points[i],cursor=el.querySelector('.cursor');cursor.setAttribute('x1',xp(i));cursor.setAttribute('x2',xp(i));cursor.setAttribute('visibility','visible');el.querySelector('.tooltip').textContent=p.timestamp.replace('T',' ')+' · '+p.contract_ids.join(' / ')+' · '+r.variant_label+'\n'+fs.map(f=>{const p=r.series[f.key][i];return f.label+' '+fmt(p,r)+' '+unit(p,r)+' · '+(p.value===null?reasons(p,r):'有效')}).join('\n')})}
$('#indicator').onchange=populateX;$('#variant').onchange=load;$('#identity').onchange=load;$('#day').onchange=load;$('#source').onchange=()=>{for(const id of ['identity','day'])$('#'+id).value='';load()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{group=b.dataset.group;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));$('#identity').innerHTML=option('','按资料规则逐日选择合约');populate()});fetch('/api/catalog').then(r=>r.json()).then(r=>{catalog=r;populate()}).catch(e=>$('#error').textContent=e.message);
</script></html>
